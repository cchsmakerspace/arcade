<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Fallback Browser Tab Title -->
  <title>Arcade Game</title>
  
  <!-- 1. p5.js Core Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <!-- 2. Dynamic Title Loader (Fetches title from local meta.json) -->
  <script>
    fetch('meta.json')
      .then(res => res.ok ? res.json() : null)
      .then(data => { if (data && data.title) document.title = data.title; })
      .catch(() => {});
  </script>

  <!-- 3. Universal Arcade Centering Canvas CSS -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- 4. Load Helper Assets -->
  <script src="/assets/helpers.js"></script>

  <!-- 5. Load Local Game Code -->
  <script src="sketch.js"></script>

</body>
</html>
